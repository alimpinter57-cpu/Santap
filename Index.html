<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Santap — AI Nutrition & Activity Tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1F4D3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Santap">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F6F1; --surface:#FFFFFF; --surface-2:#EAF1E7;
    --ink:#16241C; --ink-soft:#57685C; --ink-faint:#8A988D;
    --moss:#2F6E52; --moss-strong:#1F4D3A; --moss-tint:#E1EEE4;
    --ochre:#C9812E; --ochre-tint:#F8ECD9;
    --berry:#A24E68; --berry-tint:#F5E7EB;
    --sky:#3E7EA6; --sky-tint:#E5F1F6;
    --line:#DDE5DA;
    --shadow: 0 1px 2px rgba(22,36,28,.07), 0 6px 20px -12px rgba(22,36,28,.18);
    --r-s:10px; --r-m:16px; --r-l:24px;
    --font-d:'Space Grotesk','Inter',sans-serif;
    --font-b:'Inter',system-ui,-apple-system,sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#10160F; --surface:#182119; --surface-2:#1E2A22;
      --ink:#EAF2EC; --ink-soft:#A6B6AB; --ink-faint:#6C7A70;
      --moss:#63AE8B; --moss-strong:#8ED0AE; --moss-tint:#1D3327;
      --ochre:#E3A75B; --ochre-tint:#2E2415;
      --berry:#D08BA0; --berry-tint:#2E1E24;
      --sky:#79B0CE; --sky-tint:#142631;
      --line:#28352C;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 20px -12px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#10160F; --surface:#182119; --surface-2:#1E2A22;
    --ink:#EAF2EC; --ink-soft:#A6B6AB; --ink-faint:#6C7A70;
    --moss:#63AE8B; --moss-strong:#8ED0AE; --moss-tint:#1D3327;
    --ochre:#E3A75B; --ochre-tint:#2E2415;
    --berry:#D08BA0; --berry-tint:#2E1E24;
    --sky:#79B0CE; --sky-tint:#142631;
    --line:#28352C;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--font-b);
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  h1,h2,h3{font-family:var(--font-d); margin:0; letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; color:inherit;}
  ::selection{background:var(--moss-tint);}
  .icon{display:block; flex-shrink:0;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--moss); outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  #app{min-height:100vh;}
  .app-shell{
    max-width:480px; margin:0 auto; min-height:100vh; position:relative;
    display:flex; flex-direction:column; background:var(--paper);
  }
  .topbar{
    padding:16px 18px 4px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  .eyebrow{font-size:12.5px; color:var(--ink-faint); margin:0 0 2px;}
  .greet h1{font-size:22px; font-weight:700;}
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--moss-strong); box-shadow:var(--shadow);
  }
  .icon-btn:active{transform:scale(.94);}
  .main-scroll{flex:1; overflow-y:auto; padding:6px 18px 110px; -webkit-overflow-scrolling:touch;}
  .page{display:flex; flex-direction:column; gap:22px; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .section-label{font-size:13px; font-weight:600; color:var(--ink-soft); text-transform:none;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .link-btn{background:none; border:none; color:var(--moss-strong); font-size:13px; font-weight:600; padding:4px;}
  .text-btn{background:none; border:none; color:var(--moss-strong); font-size:13.5px; font-weight:600; padding:2px 0; align-self:flex-start;}

  .hero-card{
    background:var(--surface); border-radius:var(--r-l); padding:20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:16px;
  }
  .hero-top{display:flex; align-items:center; gap:16px;}
  .rings{position:relative; width:96px; height:96px; flex-shrink:0;}
  .rings svg{width:100%; height:100%; transform:rotate(-90deg);}
  .rings-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .rings-center strong{font-family:var(--font-d); font-size:20px; line-height:1;}
  .rings-center span{font-size:10.5px; color:var(--ink-faint);}
  .hero-stats{flex:1; display:flex; flex-direction:column; gap:8px;}
  .hero-stat-row{display:flex; align-items:center; justify-content:space-between; font-size:13px;}
  .hero-stat-row .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px;}
  .hero-stat-label{display:flex; align-items:center; color:var(--ink-soft);}
  .hero-stat-val{font-weight:700; font-family:var(--font-d);}
  .macro-bars{display:flex; flex-direction:column; gap:8px;}
  .macro-row{display:grid; grid-template-columns:64px 1fr 40px; align-items:center; gap:8px; font-size:12px;}
  .macro-track{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
  .macro-fill{height:100%; border-radius:4px;}

  .cups{display:flex; gap:8px; flex-wrap:wrap;}
  .cup-btn{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--sky); background:var(--sky-tint);
    color:var(--sky); display:flex; align-items:center; justify-content:center;
  }
  .cup-btn.filled{background:var(--sky); color:#fff;}
  .cup-btn.wide{width:auto; height:32px; border-radius:999px; padding:0 12px; font-size:12.5px; font-weight:600;}
  .cup-btn.wide.ghost{background:transparent; border-style:dashed; color:var(--ink-faint); border-color:var(--line);}
  .water-custom-row{display:flex; gap:8px; align-items:center;}
  .water-custom-row .text-input{flex:1; margin-top:0;}
  .hydration-row{display:flex; flex-direction:column; gap:10px;}
  .hydration-top{display:flex; align-items:center; justify-content:space-between;}
  .hydration-count{font-size:12.5px; color:var(--ink-soft);}

  .timeline{display:flex; flex-direction:column;}
  .tl-item{display:flex; gap:12px; padding-bottom:16px; position:relative;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-rail{display:flex; flex-direction:column; align-items:center; width:14px;}
  .tl-dot{width:10px; height:10px; border-radius:50%; background:var(--moss); margin-top:4px; flex-shrink:0;}
  .tl-line{flex:1; width:2px; background:var(--line); margin-top:2px;}
  .tl-item:last-child .tl-line{display:none;}
  .tl-body{flex:1; padding-bottom:2px;}
  .tl-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; cursor:pointer;}
  .tl-time{font-size:11.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .tl-slot{font-size:14.5px; font-weight:600;}
  .tl-foods{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .tl-kcal{font-size:12.5px; color:var(--ink-faint); font-family:var(--font-d);}
  .tl-detail{margin-top:10px; background:var(--surface-2); border-radius:var(--r-s); padding:12px; display:flex; flex-direction:column; gap:8px;}
  .tl-detail-item{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; gap:8px;}
  .tl-detail-item .nm{font-weight:600;}
  .tl-detail-item .meta{color:var(--ink-faint); font-size:11.5px;}
  .badge{font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:20px; white-space:nowrap;}
  .badge-high{background:var(--moss-tint); color:var(--moss-strong);}
  .badge-medium{background:var(--ochre-tint); color:var(--ochre);}
  .badge-low{background:var(--berry-tint); color:var(--berry);}
  .badge-custom{background:var(--sky-tint); color:var(--sky);}
  .tl-actions{display:flex; gap:8px; margin-top:2px;}
  .mini-btn{font-size:12px; font-weight:600; border-radius:20px; padding:6px 12px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; gap:5px;}
  .mini-btn.danger{color:var(--berry); border-color:var(--berry-tint);}
  .mini-btn.primary{color:var(--moss-strong); border-color:var(--moss-tint);}

  .empty-note{font-size:13px; color:var(--ink-faint); background:var(--surface); border:1px dashed var(--line); border-radius:var(--r-m); padding:16px; text-align:center;}

  .insight-card{background:var(--moss-tint); border-radius:var(--r-l); padding:16px 18px; display:flex; flex-direction:column; gap:8px;}
  .insight-text{font-size:13.5px; color:var(--moss-strong); line-height:1.45;}

  .quickadd-row{display:flex; gap:10px;}
  .quick-chip{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); font-size:12px; font-weight:600; color:var(--ink-soft); box-shadow:var(--shadow);
  }
  .quick-chip .icon{color:var(--moss-strong);}
  .quick-chip:active{transform:scale(.96);}

  .fab{
    position:absolute; right:20px; bottom:92px; width:58px; height:58px; border-radius:50%;
    background:var(--moss-strong); color:#fff; border:none; box-shadow:0 10px 24px -8px rgba(31,77,58,.55);
    display:flex; align-items:center; justify-content:center; z-index:20;
  }
  .fab:active{transform:scale(.94);}

  .bottomnav{
    display:flex; border-top:1px solid var(--line); background:var(--surface);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)); position:relative; z-index:15;
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
    background:none; border:none; color:var(--ink-faint); font-size:10.5px; font-weight:600;
  }
  .nav-btn.active{color:var(--moss-strong);}

  /* Cards / lists shared */
  .card{background:var(--surface); border-radius:var(--r-m); padding:14px 16px; box-shadow:var(--shadow);}
  .list-flat{display:flex; flex-direction:column; gap:10px;}
  .row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}

  /* Favorites */
  .fav-scroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
  .fav-chip{
    flex-shrink:0; display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line);
    border-radius:20px; padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft); box-shadow:var(--shadow);
  }
  .fav-chip .icon{color:var(--ochre);}

  /* Tabs */
  .tabs{display:flex; gap:6px; background:var(--surface-2); border-radius:20px; padding:4px;}
  .tab-btn{flex:1; border:none; background:none; padding:8px 4px; border-radius:16px; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .tab-btn.active{background:var(--surface); color:var(--moss-strong); box-shadow:var(--shadow);}

  .searchbar{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:10px 14px; box-shadow:var(--shadow);}
  .searchbar input{flex:1; border:none; outline:none; background:none; font-size:14px; color:var(--ink);}
  .searchbar .icon{color:var(--ink-faint);}

  /* Activity */
  .act-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .act-tile{
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 4px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r-m); font-size:11.5px; font-weight:600; color:var(--ink-soft); box-shadow:var(--shadow);
  }
  .act-tile.selected{border-color:var(--moss); background:var(--moss-tint); color:var(--moss-strong);}
  .act-tile .icon{color:var(--ochre);}
  .act-tile.selected .icon{color:var(--moss-strong);}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .dur-chip{padding:9px 16px; border-radius:20px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-soft);}
  .dur-chip.selected{background:var(--moss-strong); border-color:var(--moss-strong); color:#fff;}
  .field-label{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:8px; display:block;}
  .field-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;}
  .text-input, textarea.text-input{
    width:100%; border:1px solid var(--line); border-radius:var(--r-s); padding:11px 13px; font-size:14px;
    background:var(--surface); color:var(--ink); outline:none;
  }
  textarea.text-input{resize:vertical; min-height:64px;}
  .btn-primary{
    background:var(--moss-strong); color:#fff; border:none; border-radius:26px; padding:13px 20px; font-size:14.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }
  .btn-primary:disabled{opacity:.45;}
  .btn-secondary{
    background:var(--surface); color:var(--ink-soft); border:1px solid var(--line); border-radius:26px; padding:12px 18px; font-size:13.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }

  /* Insights */
  .insight-metric{display:flex; align-items:center; gap:14px; background:var(--surface); border-radius:var(--r-m); padding:14px 16px; box-shadow:var(--shadow);}
  .insight-arc{flex-shrink:0;}
  .insight-metric h3{font-size:13.5px; margin-bottom:3px;}
  .insight-metric p{font-size:12.5px; color:var(--ink-soft); line-height:1.4;}

  /* Onboarding */
  .onb-wrap{min-height:100vh; display:flex; flex-direction:column; max-width:480px; margin:0 auto; padding:28px 24px; background:var(--paper);}
  .onb-dots{display:flex; gap:6px; margin-bottom:26px;}
  .onb-dot{height:5px; flex:1; border-radius:3px; background:var(--surface-2);}
  .onb-dot.done{background:var(--moss);}
  .onb-body{flex:1; display:flex; flex-direction:column; gap:18px;}
  .onb-emoji{font-size:44px;}
  .onb-body h1{font-size:25px; margin-bottom:6px;}
  .onb-body .sub{font-size:14px; color:var(--ink-soft); line-height:1.5;}
  .chip-select{padding:10px 15px; border-radius:20px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-soft);}
  .chip-select.selected{background:var(--moss-strong); border-color:var(--moss-strong); color:#fff;}
  .onb-actions{display:flex; gap:10px; padding-top:18px;}
  .onb-skip{text-align:center; font-size:13px; color:var(--ink-faint); padding-top:14px; background:none; border:none; text-decoration:underline;}

  /* Modal sheet */
  .sheet-overlay{position:fixed; inset:0; background:rgba(16,22,15,.5); display:flex; align-items:flex-end; z-index:50; animation:fadeIn .2s ease;}
  .sheet{
    width:100%; max-width:480px; margin:0 auto; background:var(--paper); border-radius:24px 24px 0 0;
    max-height:88vh; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,.25);
  }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px;}
  .sheet-head h2{font-size:17px;}
  .sheet-body{overflow-y:auto; padding:8px 18px 24px; display:flex; flex-direction:column; gap:16px;}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 0;}

  .method-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .method-tile{
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px 8px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow); font-size:13px; font-weight:600; color:var(--ink);
  }
  .method-tile .icon{color:var(--moss-strong); width:26px; height:26px;}
  .method-tile.wide{grid-column:1 / -1; flex-direction:row; justify-content:center;}

  .photo-preview{width:100%; border-radius:var(--r-m); overflow:hidden; background:var(--surface-2); aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;}
  .photo-preview img{width:100%; height:100%; object-fit:cover;}
  .quality-warn{display:flex; gap:10px; background:var(--ochre-tint); color:var(--ochre); border-radius:var(--r-s); padding:12px; font-size:12.5px; align-items:flex-start;}

  .review-item{background:var(--surface); border-radius:var(--r-m); padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;}
  .review-item-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .review-item-head .nm{font-size:14.5px; font-weight:700;}
  .review-kcal{font-family:var(--font-d); font-size:13px; color:var(--ink-soft);}
  .review-note{font-size:12px; color:var(--ink-faint); background:var(--surface-2); border-radius:8px; padding:8px 10px; line-height:1.4;}
  .portion-chips{display:flex; gap:7px; flex-wrap:wrap;}
  .portion-chip{padding:7px 13px; border-radius:16px; border:1px solid var(--line); background:var(--surface); font-size:12px; font-weight:600; color:var(--ink-soft);}
  .portion-chip.selected{background:var(--moss-strong); border-color:var(--moss-strong); color:#fff;}
  .portion-chip.suggested::after{content:" ★"; font-size:10px;}

  .voice-circle{
    width:110px; height:110px; border-radius:50%; margin:10px auto; background:var(--moss-tint); color:var(--moss-strong);
    display:flex; align-items:center; justify-content:center; border:none;
  }
  .voice-circle.listening{background:var(--moss-strong); color:#fff; animation:pulseMic 1.4s ease-in-out infinite;}
  @keyframes pulseMic{0%,100%{box-shadow:0 0 0 0 rgba(47,110,82,.35);} 50%{box-shadow:0 0 0 16px rgba(47,110,82,0);}}
  .voice-status{text-align:center; font-size:13px; color:var(--ink-soft);}

  .loading-row{display:flex; align-items:center; gap:10px; justify-content:center; padding:26px 10px; color:var(--ink-soft); font-size:13.5px;}
  .spinner{width:20px; height:20px; border-radius:50%; border:2.5px solid var(--surface-2); border-top-color:var(--moss-strong); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .barcode-result{display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:var(--r-m); padding:14px; box-shadow:var(--shadow);}

  /* Chat */
  .chat-overlay{position:fixed; inset:0; background:var(--paper); z-index:60; display:flex; flex-direction:column; max-width:480px; margin:0 auto;}
  .chat-head{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line);}
  .chat-body{flex:1; overflow-y:auto; padding:16px 16px 8px; display:flex; flex-direction:column; gap:12px;}
  .bubble{max-width:82%; padding:11px 14px; border-radius:16px; font-size:13.5px; line-height:1.45;}
  .bubble.user{align-self:flex-end; background:var(--moss-strong); color:#fff; border-bottom-right-radius:4px;}
  .bubble.bot{align-self:flex-start; background:var(--surface); color:var(--ink); border-bottom-left-radius:4px; box-shadow:var(--shadow);}
  .chat-suggestions{display:flex; gap:8px; overflow-x:auto; padding:0 16px 10px;}
  .sugg-chip{flex-shrink:0; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px 13px; font-size:12px; color:var(--ink-soft); font-weight:600;}
  .chat-inputrow{display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--surface);}
  .chat-inputrow input{flex:1; border:1px solid var(--line); border-radius:22px; padding:11px 16px; font-size:14px; outline:none; background:var(--paper); color:var(--ink);}
  .send-btn{width:42px; height:42px; border-radius:50%; background:var(--moss-strong); color:#fff; border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .send-btn:disabled{opacity:.4;}

  /* Profile */
  .profile-header{display:flex; align-items:center; gap:14px;}
  .avatar-circle{width:56px; height:56px; border-radius:50%; background:var(--moss-tint); color:var(--moss-strong); display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-size:20px; font-weight:700;}
  .settings-list{display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-m); overflow:hidden;}
  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--surface); font-size:13.5px;}
  .settings-row .lbl{display:flex; align-items:center; gap:10px; color:var(--ink);}
  .settings-row .val{color:var(--ink-faint); font-size:12.5px;}
  .tag-list{display:flex; gap:6px; flex-wrap:wrap;}
  .tag{background:var(--surface-2); color:var(--ink-soft); font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:12px;}
  .privacy-list{display:flex; flex-direction:column; gap:10px; font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .privacy-list li{margin-left:16px;}
  .disclaimer{font-size:11.5px; color:var(--ink-faint); line-height:1.5; padding:4px 2px;}

  .widget-mock{background:var(--surface); border-radius:20px; padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;}
  .widget-mock h4{font-size:12px; color:var(--ink-faint); font-weight:600;}
.widget-page{gap:14px;}
.barcode-camera{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#10160f;display:flex;align-items:center;justify-content:center;}
.barcode-camera video{width:100%;height:100%;object-fit:cover;}
.barcode-guide{position:absolute;width:72%;height:30%;border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.22);}
.nutrition-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.nutrition-card{border:1px solid var(--line);border-radius:14px;padding:11px;background:var(--surface-2);}
.nutrition-card b{display:block;font-family:var(--font-d);font-size:17px;color:var(--ink);}
.nutrition-card span{display:block;font-size:10.5px;color:var(--ink-faint);margin-top:3px;}
.nutrition-note{font-size:11.5px;line-height:1.5;color:var(--ink-faint);margin-top:10px;}

  .widget-status{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--moss-strong);}
  .widget-status strong{display:block;font-size:13px;color:var(--ink);margin-bottom:3px;}
  .widget-status p{font-size:11.5px;color:var(--ink-faint);line-height:1.4;}
  .widget-live{padding:16px;}
  .widget-head{display:flex;align-items:center;justify-content:space-between;}
  .widget-head span{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--moss-strong);}
  .widget-kcal{display:flex;align-items:baseline;gap:7px;margin:8px 0 12px;}
  .widget-kcal strong{font-family:var(--font-d);font-size:34px;line-height:1;}
  .widget-kcal small{font-size:11px;color:var(--ink-faint);}
  .widget-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .widget-actions button,.widget-metrics button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 8px;text-align:left;font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;cursor:pointer;}
  .widget-actions button span{display:flex;color:var(--moss-strong);}
  .widget-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px;}
  .widget-metrics button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;}
  .widget-metrics b{font-size:14px;color:var(--ink);}
  .widget-metrics span{font-size:10px;color:var(--ink-faint);}
  .widget-note{font-size:11px;line-height:1.5;color:var(--ink-faint);padding:2px 3px 10px;}

  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:11px 18px; border-radius:22px; font-size:13px; font-weight:600; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:86%; text-align:center;
  }
  [data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{ }

  .confirm-overlay{position:fixed; inset:0; background:rgba(16,22,15,.5); display:flex; align-items:center; justify-content:center; z-index:80; padding:24px;}
  .confirm-box{background:var(--surface); border-radius:var(--r-l); padding:22px; max-width:340px; width:100%; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow);}
  .confirm-box h3{font-size:16px;}
  .confirm-box p{font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .confirm-actions{display:flex; gap:10px;}
</style>

  return null;

   aliases.json itself declares: exact alias match first, then a recipe

function findFoodMatch(phrase){

      if(a && norm.indexOf(a)!==-1 && a.length>bestLen){ best = FOOD_CATALOG.byId[rcp.id]; bestLen = a.length; }
    });
  });
  if(best) return best;
  RAW_FOODS.forEach(function(f){

      if(a && norm.indexOf(a)!==-1 && a.length>bestLen){ best = FOOD_CATALOG.byId[f.id]; bestLen = a.length; }
    });
  });
  return best;
}

function defaultState(){

    meals:[], activities:[], favorites:[], water:{}, lastPortion:{}, chat:[], customFoods:[],

  };

function mergeObject(base, extra){
  var out = {};
  Object.keys(base).forEach(function(k){ out[k]=base[k]; });
  if(extra && typeof extra==='object'){
    Object.keys(extra).forEach(function(k){ out[k]=extra[k]; });
  }
  return out;
}

function sanitizeLoadedState(parsed){
  var d = defaultState();
  parsed = parsed && typeof parsed==='object' ? parsed : {};
  var out = mergeObject(d, parsed);
  out.version = LS_VERSION;
  out.profile = mergeObject(d.profile, parsed.profile);
  out.profile.prefs = Array.isArray(out.profile.prefs) ? out.profile.prefs : [];
  out.profile.allergies = Array.isArray(out.profile.allergies) ? out.profile.allergies : [];
  out.meals = Array.isArray(out.meals) ? out.meals : [];
  out.activities = Array.isArray(out.activities) ? out.activities : [];
  out.favorites = Array.isArray(out.favorites) ? out.favorites : [];
  out.chat = Array.isArray(out.chat) ? out.chat.slice(-30) : [];
  out.water = out.water && typeof out.water==='object' ? out.water : {};
  /* v2 stored water as a "glasses" count (0-8, one fixed cup size). v3 stores
     ml directly so people can log the amount they actually drank instead of
     an assumed-equal cup. Convert old counts once, at ~250 ml/glass. */
  if((!parsed.version || parsed.version<3)){
    var migratedWater = {};
    Object.keys(out.water).forEach(function(k){
      var v = out.water[k];
      migratedWater[k] = (typeof v==='number' && isFinite(v)) ? Math.round(v*250) : 0;
    });
    out.water = migratedWater;
  }
  out.lastPortion = out.lastPortion && typeof out.lastPortion==='object' ? out.lastPortion : {};
  /* User-entered foods not in the built-in database — kept separate and
     flagged as "Kustom" everywhere they appear, since they haven't been
     checked against any nutrition source. */
  out.customFoods = Array.isArray(out.customFoods) ? out.customFoods : [];
  /* UI is deliberately not persisted: modal/File/SpeechRecognition objects are transient. */
  out.ui = {view:'home', modal:null};
  return out;
}

function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw){
      /* Migrate the original v1 storage once, if it exists. */
      raw = localStorage.getItem('santap_state_v1');
    }
    if(!raw) return defaultState();
    return sanitizeLoadedState(JSON.parse(raw));
  }catch(e){
    storageOK = false;
    return defaultState();
  }
}

/* item macro helper: given a db entry and target grams, scale values */
function scaleFromDb(db, grams){
  var f = grams / db.grams;
  return {
    name: db.name, portionLabel: Math.round(grams)+' g', grams: grams,
    kcal: Math.round(db.kcal*f), protein: round1(db.protein*f), carbs: round1(db.carbs*f),
    fat: round1(db.fat*f), fiber: round1(db.fiber*f), sugar: round1(db.sugar*f), sodium: Math.round(db.sodium*f),
    confidence: db.confidence||'exact', note: db.note||null, dbSource: db.source||null
  };
}
function itemKcalMid(item){
  if(item.kcal!=null) return item.kcal;
  if(item.kcalMin!=null && item.kcalMax!=null) return Math.round((item.kcalMin+item.kcalMax)/2);
  return 0;
}
function itemKcalLabel(item){
  if(item.kcal!=null) return item.kcal+' kkal';
  if(item.kcalMin!=null && item.kcalMax!=null){
    if(item.kcalMin===item.kcalMax) return item.kcalMin+' kkal';
    return '~'+item.kcalMin+'–'+item.kcalMax+' kkal';
  }
  return '- kkal';
}
function mealTotals(meal){
  var t = {kcal:0, protein:0, carbs:0, fat:0, fiber:0, sugar:0, sodium:0};
  (meal.items||[]).forEach(function(it){
    t.kcal += itemKcalMid(it);
    t.protein += it.protein||0; t.carbs += it.carbs||0; t.fat += it.fat||0; t.fiber += it.fiber||0;
    t.sugar += it.sugar||0; t.sodium += it.sodium||0;
  });
  return t;
}
function dayMeals(iso){ return state.meals.filter(function(m){ return m.dateISO===iso; }).sort(function(a,b){ return a.time<b.time?-1:1; }); }
function dayActivities(iso){ return state.activities.filter(function(a){ return a.dateISO===iso; }).sort(function(a,b){ return a.time<b.time?-1:1; }); }
function dayTotals(iso){
  var t = {kcal:0, protein:0, carbs:0, fat:0, fiber:0, sugar:0, sodium:0};
  dayMeals(iso).forEach(function(m){ var mt=mealTotals(m); t.kcal+=mt.kcal; t.protein+=mt.protein; t.carbs+=mt.carbs; t.fat+=mt.fat; t.fiber+=mt.fiber; t.sugar+=mt.sugar; t.sodium+=mt.sodium; });
  return t;
}
function dayActivityMinutes(iso){
  return dayActivities(iso).reduce(function(s,a){ return s+(a.minutes||0); },0);
}
function last7Days(){

  for(var i=6;i>=0;i--){ var dd=new Date(d); dd.setDate(d.getDate()-i); arr.push(isoOf(dd)); }

}

function localParseFoodText(text){
  var raw = text.toLowerCase();
  var parts = raw.split(/,| dan | sama |\+|\n/).map(function(s){ return s.trim(); }).filter(Boolean);
  if(parts.length===0) parts=[raw];
  var items = [];
  parts.forEach(function(part){
    /* Recognize an explicit weight unit anywhere in the phrase (e.g. "nasi 1 kilogram",
       "ayam 500 gram", "nasi 2 ons") and treat it as an absolute gram amount, rather than
       only reading a leading count that multiplies the default serving size. This is what
       let people log a custom kilogram amount of rice/etc. */
    var gramsOverride = null;
    var um = part.match(/(\d+([.,]\d+)?)\s*(kilogram|kilo|kg|ons|gram|gr|g)\b/i);
    if(um){
      var uval = parseFloat(um[1].replace(',','.'));
      var uunit = um[3].toLowerCase();
      if(uunit==='kilogram'||uunit==='kilo'||uunit==='kg') gramsOverride = uval*1000;
      else if(uunit==='ons') gramsOverride = uval*100;
      else gramsOverride = uval; /* gram / gr / g */
      part = (part.slice(0,um.index)+' '+part.slice(um.index+um[0].length)).trim();
    }
    var qty = 1; var qm = part.match(/^(\d+([.,]\d+)?)\s*/);
    if(qm){ qty = parseFloat(qm[1].replace(',','.')); part = part.slice(qm[0].length); }
    var found = findFoodMatch(part);
    if(found){
      /* If the DB's default label already represents more than one piece
         (e.g. "tahu 2 potong = 60 g"), a typed count must scale from the
         weight of ONE piece (unitGrams), not from the whole default record —
         otherwise "1 potong tahu" was coming out as 60 g (the 2-piece
         default) instead of ~30 g. */
      var perUnit = found.unitGrams || found.grams;
      var grams = gramsOverride!=null ? gramsOverride : perUnit*qty;
      var key = found.id;
      if(gramsOverride==null && !found.unitGrams && state.lastPortion[key]) grams = state.lastPortion[key]*qty;
      var it = scaleFromDb(found, grams);
      it.confidence='medium'; it.source='text';
      items.push(it);
    } else if(part.trim()){
      items.push({name: part.trim().charAt(0).toUpperCase()+part.trim().slice(1), portionLabel:'porsi wajar', grams:100, kcalMin:60,kcalMax:250, protein:0,carbs:0,fat:0,fiber:0,sugar:0,sodium:0, confidence:'low', note:'Tidak ditemukan di database — silakan cari manual atau sesuaikan.', source:'text'});
    }
  });
  return {items:items, overall_confidence:'medium', usedAI:false};
}

function checkImageBrightness(file){
  return new Promise(function(resolve){
    try{
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        try{
          var w=32,h=32; var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
          var ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
          var data = ctx.getImageData(0,0,w,h).data;
          var sum=0,count=0;
          for(var i=0;i<data.length;i+=4){ sum += (data[i]+data[i+1]+data[i+2])/3; count++; }
          var avg = sum/count;
          URL.revokeObjectURL(url);
          resolve({ok: avg>50, avg:avg});
        }catch(e){ URL.revokeObjectURL(url); resolve({ok:true}); }
      };
      img.onerror = function(){ resolve({ok:true}); };
      img.src = url;
    }catch(e){ resolve({ok:true}); }
  });
}

function enrichNutritionItem(it){
  var name=(it.name||'').toLowerCase();
  var db=null;
  for(var i=0;i<FOOD_DB.length;i++){
    var d=FOOD_DB[i];
    if(d.name.toLowerCase()===name || d.aliases.some(function(a){ return name.indexOf(a)!==-1 || a.indexOf(name)!==-1; })){ db=d; break; }
  }
  if(!db) return it;
  var grams=Number(it.grams)||db.grams;
  var scaled=scaleFromDb(db, grams);
  scaled.confidence = it.confidence || 'medium';
  scaled.note = it.note || 'Nilai nutrisi dipadankan dengan database lokal berdasarkan nama makanan; porsi tetap perkiraan.';
  scaled.source = it.source || 'ai+local-db';
  return scaled;
}

function buildDataSummaryForAssistant(){
  var iso = todayISO();

  var week = last7Days();
  var daysWithMeals = week.filter(function(d){ return dayMeals(d).length>0; }).length;
  var actMin = dayActivityMinutes(iso);
  return 'Hari ini ('+iso+'): '+meals.length+' catatan makan ('+(names.join(', ')||'belum ada')+'), total perkiraan '+Math.round(dt.kcal)+' kkal, protein '+round1(dt.protein)+' g, karbohidrat '+round1(dt.carbs)+' g, lemak '+round1(dt.fat)+' g, serat '+round1(dt.fiber)+' g. Aktivitas hari ini: '+actMin+' menit. Dalam 7 hari terakhir, pengguna mencatat makanan pada '+daysWithMeals+' dari 7 hari.';
}

function confidenceBadge(conf){
  if(conf==='exact') return '';
  if(conf==='custom') return '<span class="badge badge-custom">Kustom</span>';
  var label = conf==='high'?'Yakin tinggi':(conf==='low'?'Kurang yakin':'Cukup yakin');
  var cls = conf==='high'?'badge-high':(conf==='low'?'badge-low':'badge-medium');

function ringCluster(mealsCount, actMin, waterMl){
  var mealPct = clamp(mealsCount/4,0,1);
  var actPct = clamp(actMin/45,0,1);
  var waterPct = clamp(waterMl/WATER_TARGET_ML,0,1);
  function arc(r,pct,color){
    var c = 2*Math.PI*r;
    var off = c*(1-pct);
    return '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="7"/>'+
      '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>';

function homeInsightSentence(iso, meals, acts){
  if(meals.length===0 && acts.length===0) return 'Belum ada catatan hari ini. Mulai dengan mencatat sarapan atau aktivitasmu.';
  if(acts.length===0) return 'Belum ada aktivitas tercatat hari ini — jalan santai singkat pun bisa dicatat.';
  var totalMin = dayActivityMinutes(iso);
  var avgPrev = averagePrevActivityMinutes(iso);
  if(avgPrev!=null && totalMin>avgPrev*1.15) return 'Aktivitasmu hari ini lebih tinggi dari rata-rata harimu belakangan ini.';
  if(meals.length>0){
    var cats = {}; meals.forEach(function(m){ (m.items||[]).forEach(function(it){ var db=findDbByName(it.name); if(db) cats[db.cat]=true; }); });
    if(!cats['Sayur'] && !cats['Buah']) return 'Sayur atau buah belum tercatat hari ini — bisa jadi ide tambahan untuk makan berikutnya.';
  }
  return 'Pola makan dan aktivitasmu hari ini tercatat cukup baik. Terus lanjutkan konsistensinya.';
}
function findDbByName(name){
  var low = (name||'').toLowerCase();
  for(var i=0;i<FOOD_DB.length;i++){ if(FOOD_DB[i].name.toLowerCase()===low) return FOOD_DB[i]; }
  return null;
}
function averagePrevActivityMinutes(excludeIso){
  var days = last7Days().filter(function(d){ return d!==excludeIso; });
  if(days.length===0) return null;
  var sum = days.reduce(function(s,d){ return s+dayActivityMinutes(d); },0);
  return sum/days.length;
}

function estimateActivityKcal(activityId, minutes){
  var act = ACTIVITY_TYPES.find(function(a){ return a.id===activityId; }) || ACTIVITY_TYPES[ACTIVITY_TYPES.length-1];
  var w = state.profile.weightKg || 60;
  return Math.round(act.met*3.5*w/200*minutes);
}
function parseActivityFreeText(text){
  var low = text.toLowerCase();
  var found = null;
  for(var i=0;i<ACTIVITY_TYPES.length;i++){
    var a = ACTIVITY_TYPES[i];
    for(var j=0;j<a.keywords.length;j++){ if(low.indexOf(a.keywords[j])!==-1){ found = a; break; } }
    if(found) break;
  }
  var minutes = 30;
  var mHour = low.match(/(\d+([.,]\d+)?)\s*jam/);
  var mMin = low.match(/(\d+)\s*menit/);
  if(mHour){ minutes = Math.round(parseFloat(mHour[1].replace(',','.'))*60); }
  else if(mMin){ minutes = parseInt(mMin[1]); }
  if(!found) found = ACTIVITY_TYPES[ACTIVITY_TYPES.length-1];
  return {activityId:found.id, label:found.name, minutes:minutes};
}

    if(!q) return true;

function reviewStepHtml(m){
  var items = m.data.items||[];
  var body = '';
  if(m.data.qualityNote){
    body += '<div class="quality-warn">'+icon('info',18)+'<span>'+escapeHtml(m.data.qualityNote)+'</span></div>';
  }
  if(m.data.uncertaintySummary){
    body += '<div class="review-note">'+escapeHtml(m.data.uncertaintySummary)+'</div>';
  }
  if(items.length===0){
    body += '<div class="empty-note">AI belum yakin mengenali makanan ini. Coba foto/deskripsi lain, atau cari manual.</div>';
    body += '<button class="btn-secondary" data-action="switchToSearch">'+icon('search',16)+'Cari manual</button>';
  } else {
    items.forEach(function(it, idx){
      body += '<div class="review-item"><div class="review-item-head"><span class="nm">'+escapeHtml(it.name)+'</span>'+confidenceBadge(it.confidence)+'</div>';
      body += '<div class="row-between"><span style="font-size:12.5px;color:var(--ink-soft);">'+escapeHtml(it.portionLabel||'')+'</span><span class="review-kcal">'+itemKcalLabel(it)+'</span></div>';
      body += '<div style="font-size:10.5px;color:var(--ink-faint);line-height:1.45;margin-top:4px;">P '+round1(it.protein||0)+' g • K '+round1(it.carbs||0)+' g • L '+round1(it.fat||0)+' g • Serat '+round1(it.fiber||0)+' g • Gula '+round1(it.sugar||0)+' g • Natrium '+Math.round(it.sodium||0)+' mg</div>';
      if(it.note) body += '<div class="review-note">'+escapeHtml(it.note)+'</div>';
      if(it.dbSource) body += '<div class="review-note" style="opacity:0.75;">Sumber: '+escapeHtml(it.dbSource)+'</div>';
      body += portionChipsHtml(it, idx);
      body += '</div>';
    });
    body += '<button class="btn-primary" data-action="confirmAddItems">'+icon('check',18)+'Tambahkan ke catatan ('+items.length+' item)</button>';
  }
  return body;
}
function portionOptionsFor(item){
  var base = item.grams || 100;
  var opts = [Math.round(base*0.66), base, Math.round(base*1.33)];
  var seen = {}; var uniq=[];
  opts.forEach(function(g){ if(!seen[g]){ seen[g]=1; uniq.push(g); } });
  return uniq;
}
function portionChipsHtml(item, idx){
  var opts = portionOptionsFor(item);
  var key = item.name.toLowerCase();
  var suggested = state.lastPortion[key];
  var html = '<div class="portion-chips">';
  opts.forEach(function(g){
    var sel = item.grams===g;
    html += '<button class="portion-chip'+(sel?' selected':'')+(suggested===g?' suggested':'')+'" data-action="setItemPortion" data-idx="'+idx+'" data-grams="'+g+'">'+g+' g</button>';
  });
  html += '<button class="portion-chip'+(item.customPortion?' selected':'')+'" data-action="setItemPortionCustom" data-idx="'+idx+'">Custom</button>';
  html += '</div>';
  if(item.customPortion){
    html += '<input class="text-input" type="number" min="1" style="margin-top:8px;" data-action-input="customGrams" data-idx="'+idx+'" value="'+item.grams+'" placeholder="Gram">';
  }
  return html;
}

function viewOnboarding(){
  var step = state.ui.onbStep||0;
  var dots = '';
  for(var i=0;i<4;i++){ dots += '<div class="onb-dot'+(i<=step?' done':'')+'"></div>'; }
  var body='';
  if(step===0){
    body = '<div class="onb-emoji">🥗</div><h1>Selamat datang di Santap</h1><p class="sub">Catat makanan & aktivitasmu secepat mungkin — cukup foto, ketik, atau ucapkan. Kami bantu perkirakan nutrisinya.</p>';
  } else if(step===1){
    body = '<h1>Sedikit tentang kamu</h1><p class="sub">Bagian ini opsional dan hanya membantu memberi wawasan yang lebih relevan.</p>';
    body += '<div><span class="field-label">Usia (opsional)</span><input class="text-input" type="number" id="onbAge" value="'+(state.profile.age||'')+'" placeholder="cth: 24"></div>';
    body += '<div><span class="field-label">Level aktivitas umum</span><div class="chip-row">';
    ['Jarang aktif','Cukup aktif','Sangat aktif'].forEach(function(lv){
      body += '<button class="chip-select'+(state.profile.activityLevel===lv?' selected':'')+'" data-action="setOnbActivity" data-lv="'+lv+'">'+lv+'</button>';
    });
    body += '</div></div>';
  } else if(step===2){
    body = '<h1>Preferensi makan</h1><p class="sub">Pilih beberapa yang sesuai (opsional).</p>';
    body += '<div class="chip-row">'+PREF_OPTIONS.map(function(pr){
      var sel = state.profile.prefs.indexOf(pr)!==-1;
      return '<button class="chip-select'+(sel?' selected':'')+'" data-action="toggleOnbPref" data-pr="'+pr+'">'+pr+'</button>';
    }).join('')+'</div>';
    body += '<div><span class="field-label">Alergi (opsional, pisahkan dengan koma)</span><input class="text-input" id="onbAllergy" value="'+escapeHtml((state.profile.allergies||[]).join(', '))+'" placeholder="cth: kacang, seafood"></div>';
  } else if(step===3){
    body = '<h1>Tujuan umum</h1><p class="sub">Ini membantu kami menyesuaikan wawasan, bukan target angka.</p>';
    body += '<div class="chip-row">'+GOAL_OPTIONS.map(function(g){
      var sel = state.profile.goal===g;
      return '<button class="chip-select'+(sel?' selected':'')+'" data-action="setOnbGoal" data-g="'+g+'">'+g+'</button>';
    }).join('')+'</div>';
    body += '<div><span class="field-label">Berat badan (opsional)</span><p class="sub" style="margin-bottom:8px;">Hanya dipakai untuk memperhalus perkiraan kalori aktivitas. Jika dilewati, kami pakai asumsi rata-rata umum.</p><input class="text-input" type="number" id="onbWeight" value="'+(state.profile.weightKg||'')+'" placeholder="cth: 60 (opsional)"></div>';
  }
  var html = '<div class="onb-wrap"><div class="onb-dots">'+dots+'</div><div class="onb-body">'+body+'</div>';
  html += '<div class="onb-actions">';
  if(step>0) html += '<button class="btn-secondary" data-action="onbBack">Kembali</button>';
  html += '<button class="btn-primary" data-action="onbNext">'+(step===3?'Mulai':'Lanjut')+'</button>';
  html += '</div>';
  if(step>0 && step<3) html += '<button class="onb-skip" data-action="onbNext">Lewati</button>';
  html += '</div>';
  return html;
}

  if(m.type==='addMeal') return modalAddMeal();
  if(m.type==='chat') return chatOverlayHtml();
  return '';
}

/* render() used to have no error boundary: any unexpected exception while
   drawing a view (a bad photo/file result, a corrupted saved item, etc.)
   left the screen blank/stuck with only a console error, so the person had
   no way back in except reloading the page. Wrapping it means a broken
   screen always falls back to a recovery card with a working button. */
/* =========================================================
   MODAL <-> BROWSER/HARDWARE BACK BUTTON
   Without this, opening a tool (the + menu, chat, etc.) never told the
   browser history about it. So pressing the Android back button (the
   triangle) didn't just close the sheet — it navigated the whole page
   back/away, and returning via the recent-apps (square) button often
   landed on a stuck/blank state. Now opening a modal pushes one history
   entry, and the back button just closes the modal instead of leaving
   the app. Closing a modal from inside the app (X button, tapping the
   backdrop, confirming) goes through the same path so history stays
   in sync either way. */
var MODAL_HISTORY_PUSHED = false;
function pushModalHistoryIfNeeded(wasModalOpenBefore){
  if(wasModalOpenBefore) return; /* already own a history entry for the open modal */
  try{ history.pushState({santapModal:true}, document.title, location.href); MODAL_HISTORY_PUSHED = true; }
  catch(e){ MODAL_HISTORY_PUSHED = false; }
}
function closeModalNow(){
  stopBarcodeScanner();
  state.ui.modal = null;
  saveState();
  render();
}
function dismissModal(){
  if(MODAL_HISTORY_PUSHED){
    MODAL_HISTORY_PUSHED = false;
    try{ history.back(); return; }catch(e){ /* fall through */ }
  }
  closeModalNow();
}
window.addEventListener('popstate', function(){
  MODAL_HISTORY_PUSHED = false;
  if(state && state.ui && state.ui.modal){ closeModalNow(); }
});

function render(){
  try{
    renderUnsafe();
  }catch(err){
    console.error('Render error:', err);
    try{
      var root = document.getElementById('app');
      root.innerHTML = '<div style="padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;">'+
        '<h2 style="font-family:var(--font-d);font-size:18px;">Tampilan bermasalah</h2>'+
        '<p style="font-size:13.5px;color:var(--ink-soft);max-width:320px;">Ada kendala saat menampilkan layar ini. Catatanmu tetap aman tersimpan di perangkat.</p>'+
        '<button class="btn-primary" style="width:auto;padding:10px 22px;" id="recoveryCloseBtn">Kembali ke Beranda</button>'+
        '</div>';
      var btn = document.getElementById('recoveryCloseBtn');
      if(btn) btn.onclick = function(){
        state.ui.modal = null; state.ui.view = 'home';
        try{ render(); }catch(e2){ location.reload(); }
      };
    }catch(e2){ /* last resort: leave existing DOM rather than throw again */ }
  }
}
function renderUnsafe(){
  var root = document.getElementById('app');
  if(!state.profile.onboarded){
    root.innerHTML = viewOnboarding();
  } else {
    var showFab = ['home','meals','activity'].indexOf(state.ui.view)!==-1 && !(state.ui.modal);
    root.innerHTML = '<div class="app-shell">'+topBar()+'<main class="main-scroll" id="mainScroll">'+mainViewHtml()+'</main>'+bottomNav()+
      (showFab? '<button class="fab" data-action="openAddMeal" aria-label="Tambah makanan">'+icon('plus',26)+'</button>':'')+
      '</div>'+modalHtml();
  }
  if(state.ui.modal && state.ui.modal.type==='chat'){
    var body = document.getElementById('chatBody'); if(body) body.scrollTop = body.scrollHeight;
  }
}

var barcodeStream = null;
var barcodeScanTimer = null;
function stopBarcodeScanner(){
  if(barcodeScanTimer){ cancelAnimationFrame(barcodeScanTimer); barcodeScanTimer=null; }
  if(barcodeStream){ barcodeStream.getTracks().forEach(function(t){ try{t.stop();}catch(e){} }); barcodeStream=null; }
}
async function startBarcodeScanner(){
  var m=state.ui.modal; if(!m) return;
  if(!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia){
    m.data.unsupported=true; render(); return;
  }
  if(!('BarcodeDetector' in window)){
    m.data.unsupported=true; render(); toast('Scanner otomatis belum didukung browser ini. Gunakan input nomor barcode.'); return;
  }
  try{
    var detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    barcodeStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    m.data.scanning=true; m.data.unsupported=false; render();
    var video=document.getElementById('barcodeVideo');
    if(!video){ stopBarcodeScanner(); return; }
    video.srcObject=barcodeStream; await video.play();
    var scan=function(){
      if(!state.ui.modal || state.ui.modal.step!=='barcode' || !state.ui.modal.data.scanning){ stopBarcodeScanner(); return; }
      detector.detect(video).then(function(codes){
        if(codes && codes.length){
          var code=codes[0].rawValue||'';
          stopBarcodeScanner();
          state.ui.modal.data.scanning=false; state.ui.modal.data.code=code;
          state.ui.modal.data.found=BARCODE_DB.find(function(b){return b.barcode===code;})||null;
          state.ui.modal.data.notFound=!state.ui.modal.data.found;
          render();
          if(!state.ui.modal.data.found) toast('Barcode terbaca: '+code+'. Produk belum ada di database lokal.');
          return;
        }
        barcodeScanTimer=requestAnimationFrame(scan);
      }).catch(function(){ barcodeScanTimer=requestAnimationFrame(scan); });
    };
    scan();
  }catch(e){ stopBarcodeScanner(); m.data.scanning=false; m.data.unsupported=true; render(); toast('Kamera barcode tidak bisa dibuka. Periksa izin kamera.'); }
}

function startMethod(method){
  var m = state.ui.modal;
  m.step = method; m.data = {};
  if(method==='voice'){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) m.data.unsupported = true;
  }
  render();
  if(method==='photo'){
    setTimeout(function(){
      var input = document.getElementById('photoFileInput');
      if(input) input.click();
    },50);
  }
}

function itemRateSnapshot(it){
  var g = it.grams||1;
  return {
    kcal: it.kcal!=null? it.kcal/g : null,
    kcalMin: it.kcalMin!=null? it.kcalMin/g : null,
    kcalMax: it.kcalMax!=null? it.kcalMax/g : null,
    protein:(it.protein||0)/g, carbs:(it.carbs||0)/g, fat:(it.fat||0)/g,
    fiber:(it.fiber||0)/g, sugar:(it.sugar||0)/g, sodium:(it.sodium||0)/g
  };
}
function openReview(items, opts){
  (items||[]).forEach(function(it){ if(!it._rate) it._rate = itemRateSnapshot(it); });
  state.ui.modal.step = 'review';
  state.ui.modal.data = {items:items||[], prevStep:(opts&&opts.prevStep)||'menu', qualityNote:(opts&&opts.qualityNote)||null, uncertaintySummary:(opts&&opts.uncertaintySummary)||null};
  render();
}
/* Recompute macros for a target gram amount from the item's original per-gram
   rate (captured once in openReview), instead of scaling relative to the
   previously *rounded* display values. Scaling from rounded numbers on every
   keystroke (e.g. while typing a custom "1000 g" / 1 kg amount) compounds
   rounding error and made custom gram/kilogram entry drift to the wrong
   calories. This keeps every recompute anchored to the original values. */
function updateReviewItemPortion(idx, grams){
  var it = state.ui.modal.data.items[idx];
  if(!it._rate) it._rate = itemRateSnapshot(it);
  grams = Math.max(1, grams);
  var r = it._rate;
  if(r.kcal!=null) it.kcal = Math.round(r.kcal*grams);
  if(r.kcalMin!=null) it.kcalMin = Math.round(r.kcalMin*grams);
  if(r.kcalMax!=null) it.kcalMax = Math.round(r.kcalMax*grams);
  it.protein = round1(r.protein*grams); it.carbs = round1(r.carbs*grams);
  it.fat = round1(r.fat*grams); it.fiber = round1(r.fiber*grams);
  it.sugar = round1(r.sugar*grams); it.sodium = Math.round(r.sodium*grams);
  it.grams = grams; it.portionLabel = grams+' g';
}
function addItemsAsMeal(items){
  var meal = {id:uid(), dateISO:todayISO(), time:nowTimeLabel(), slot:mealSlotForNow(), items:items, source:items[0]&&items[0].source};
  state.meals.push(meal);
}

async function runPhotoAnalysis(){
  var m = state.ui.modal;
  m.data.loading = true; render();
  var file = m.data.file;
  var res = await aiAnalyzePhoto(file);
  m.data.loading = false;
  if(res.error){
    toast(res.message || 'Analisis foto tidak tersedia. Coba Tulis Deskripsi.');
    m.step = 'describe'; m.data = {};
    render(); return;
  }
  openReview(res.items, {prevStep:'photo', qualityNote: res.quality_ok===false? (res.quality_note||'Foto kurang jelas, hasil mungkin kurang akurat.') : null, uncertaintySummary: res.uncertainty_summary});
}

function startVoice(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var m = state.ui.modal;
  if(!SR){ m.data.unsupported = true; render(); return; }
  try{
    var rec = new SR();
    rec.lang = 'id-ID'; rec.interimResults = false; rec.maxAlternatives = 1;
    m.data.listening = true; m.data._rec = rec; render();
    rec.onresult = function(e){
      var text = e.results[0][0].transcript;
      m.data.listening = false; m.data.transcript = text; render();
    };
    rec.onerror = function(){
      m.data.listening = false; m.data.unsupported = true; render();
    };
    rec.onend = function(){ if(m.data.listening){ m.data.listening=false; render(); } };
    rec.start();
  }catch(e){
    m.data.unsupported = true; render();
  }
}

async function sendChatMessage(text){
  state.chat.push({role:'user', content:text});
  saveState();
  appendChatBubble('user', text);
  var thinking = appendChatBubble('bot', 'Mengetik...');
  var sendBtn = document.getElementById('chatSendBtn');
  if(sendBtn) sendBtn.disabled = true;
  var res = await aiAssistantReply(text);
  if(thinking) thinking.textContent = res.text;
  state.chat.push({role:'assistant', content:res.text});
  if(state.chat.length>30) state.chat = state.chat.slice(-30);
  saveState();
  if(sendBtn) sendBtn.disabled = false;
}

function showConfirm(title, msg, onYes){
  var wrap = document.createElement('div');
  wrap.className = 'confirm-overlay';
  wrap.innerHTML = '<div class="confirm-box"><h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(msg)+'</p><div class="confirm-actions"><button class="btn-secondary" id="confirmNo">Batal</button><button class="btn-primary" id="confirmYes" style="background:var(--berry);">Hapus</button></div></div>';
  document.body.appendChild(wrap);
  wrap.querySelector('#confirmNo').onclick = function(){ wrap.remove(); };
  wrap.querySelector('#confirmYes').onclick = function(){ wrap.remove(); onYes(); };
  wrap.addEventListener('click', function(e){ if(e.target===wrap) wrap.remove(); });
}

========================================================= */
function initEvents(){
  document.body.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    if(handlers[action]) handlers[action](el, e);
  });
  document.body.addEventListener('input', function(e){
    var el = e.target;
    if(el.id==='searchFoodInput'){
      state.ui.modal.data.query = el.value;
      var wrap = document.getElementById('searchResultsWrap');
      if(wrap) wrap.innerHTML = searchResultsHtml(el.value);
    }
    if(el.id==='mealsSearchInput'){
      state.ui.mealsSearch = el.value;
      var listWrap = document.getElementById('mealsListWrap');
      if(listWrap){
        var tab = state.ui.mealsTab||'today'; var iso=todayISO(); var list;
        if(tab==='today') list = dayMeals(iso);
        else if(tab==='week'){ list=[]; last7Days().forEach(function(d){ list=list.concat(dayMeals(d)); }); }
        else { var d0=new Date(); list = state.meals.filter(function(m){ var mp=m.dateISO.split('-'); return parseInt(mp[0])===d0.getFullYear() && parseInt(mp[1])===d0.getMonth()+1; }); }
        var q = el.value.toLowerCase();
        if(q) list = list.filter(function(m){ return (m.items||[]).some(function(it){ return it.name.toLowerCase().indexOf(q)!==-1; }); });
        listWrap.innerHTML = list.length? mealListGrouped(list) : '<div class="empty-note">Tidak ada catatan yang cocok.</div>';
      }
    }
    if(el.dataset && el.dataset.actionInput==='customGrams'){
      var idx = parseInt(el.dataset.idx);
      var g = parseInt(el.value)||1;
      updateReviewItemPortion(idx, g);
    }
    if(el.id==='actCustomInput'){
      state.ui.actDuration = parseInt(el.value)||0;
    }
    var CF_FIELD_MAP = {cfName:'name', cfPortionLabel:'portionLabel', cfGrams:'grams', cfKcal:'kcal', cfProtein:'protein', cfCarbs:'carbs', cfFat:'fat', cfFiber:'fiber', cfSugar:'sugar', cfSodium:'sodium'};
    if(CF_FIELD_MAP[el.id] && state.ui.modal && state.ui.modal.data){
      var f = state.ui.modal.data.customForm || (state.ui.modal.data.customForm={});
      var key = CF_FIELD_MAP[el.id];
      f[key] = (key==='name'||key==='portionLabel') ? el.value : (parseFloat(el.value.replace(',','.'))||0);
    }
  });
  document.body.addEventListener('change', function(e){
    if(e.target.id==='photoFileInput'){
      var file = e.target.files[0];
      if(!file) return;
      var m = state.ui.modal;
      m.data.file = file;
      m.data.previewUrl = URL.createObjectURL(file);
      m.data.analyzed = false;
      render();
      checkImageBrightness(file).then(function(res){
        if(!res.ok){ m.data.qualityWarn = true; render(); }
        else if(sampleApi && sampleLimits && sampleLimits.images){ runPhotoAnalysis(); }
        else { render(); }
      });
    }
  });
  document.body.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.id==='chatInput'){ e.preventDefault(); handlers.chatSend(); }
  });
}

/* =========================================================
   INIT
========================================================= */
function applyStoredTheme(){
  try{
    var t = localStorage.getItem('santap_theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
}

function handleShortcutRoute(){
  var hash = (location.hash || '').toLowerCase();
  if(!state || !state.profile || !state.profile.onboarded || !hash) return;
  state.ui._shortcutMethod = null;
  if(hash === '#add-food') {
    state.ui.modal = {type:'addMeal', step:'menu', data:{}};
  } else if(hash === '#photo-food') {
    /* Open the add-food sheet first, then trigger the existing photo flow. */
    state.ui.modal = {type:'addMeal', step:'menu', data:{}};
    state.ui._shortcutMethod = 'photo';
  } else if(hash === '#activity') {
    state.ui.view = 'activity'; state.ui.modal = null;
  } else if(hash === '#meals') {
    state.ui.view = 'meals'; state.ui.modal = null;
  } else { return; }
  try{ history.replaceState(null, document.title, location.pathname + location.search); }catch(e){ location.hash=''; }
}

async function init(){
  state = loadState();
  applyStoredTheme();
  handleShortcutRoute();
  /* Ensure a valid persistent snapshot exists immediately. */
  saveState();
  render();
  initEvents();
  /* A shortcut can request the existing photo picker flow. */
  if(state.ui._shortcutMethod === 'photo'){
    state.ui._shortcutMethod = null;
    startMethod('photo');
  }
  await initSample();
  if(!state.profile.onboarded) return;
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden' && state) saveState(); });
window.addEventListener('pagehide', function(){ stopBarcodeScanner(); if(state) saveState(); });
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){ console.warn('Santap service worker:', err); });
  });
}

})();
</script>
